services:
  api:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
    command: sh -c "npm install && node server.js"
    restart: unless-stopped

  candle-worker:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      # 20 LIVE pairs + 43 OTC pairs (provider naming: TRUMP=TRUUSD, RIPPLE=XRPUSD,
      # BITCOIN=BTCUSD, BINANCE=BNBUSD, ETHEREUM=ETHUSD, SOLANA=SOLUSD,
      # TONCOIN=TONUSD, LITECOIN=LTCUSD, USDBRL=BRLUSD, UKBR=UKBrent, USCR=USCrude)
      - CANDLE_PAIRS=EURUSD,EURJPY,USDJPY,CADJPY,EURGBP,AUDCHF,CHFJPY,EURCAD,EURAUD,GBPCAD,GBPUSD,EURCHF,GBPJPY,AUDJPY,USDCAD,GBPAUD,AUDCAD,AUDUSD,GBPCHF,USDCHF,NZDCAD_otc,USDEGP_otc,USDCHF_otc,BRLUSD_otc,AUDNZD_otc,USDPHP_otc,USDIDR_otc,USDNGN_otc,TRUUSD_otc,USDBDT_otc,USDARS_otc,USDMXN_otc,TONUSD_otc,XRPUSD_otc,USDPKR_otc,USDINR_otc,EURCAD_otc,NZDCHF_otc,CADCHF_otc,NZDJPY_otc,USDCOP_otc,UKBrent_otc,LTCUSD_otc,USDDZD_otc,BTCUSD_otc,XAGUSD_otc,XAUUSD_otc,USCrude_otc,USDZAR_otc,USDCAD_otc,EURAUD_otc,AUDCHF_otc,EURCHF_otc,GBPCHF_otc,GBPCAD_otc,AUDCAD_otc,AUDJPY_otc,EURUSD_otc,CADJPY_otc,GBPJPY_otc,BNBUSD_otc,ETHUSD_otc,SOLUSD_otc
      - CANDLE_POLL_MS=10000
    command: node candle-worker.js
    restart: unless-stopped
